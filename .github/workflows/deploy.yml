name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: nitro-racing-web/package-lock.json

      - name: Install dependencies
        run: |
          cd nitro-racing-web
          npm ci

      - name: Build Angular app for GitHub Pages
        run: |
          cd nitro-racing-web
          npx ng build --base-href /NITRO-RACING/
          cp dist/nitro-racing-web/browser/index.html dist/nitro-racing-web/browser/404.html
          touch dist/nitro-racing-web/browser/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nitro-racing-web/dist/nitro-racing-web/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
